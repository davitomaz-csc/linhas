<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f3b5f"><meta name="description" content="Linhas, pontos de embarque e horários · Kinross"><title>Linhas e horários · Kinross</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--co:#0f3b5f;--coi:#fff;--ink:#14202c;--mut:#566474;--rule:#e1e6ec;--soft:#f3f5f8;--ok:#147a3c;--okb:#e6f5ec;--off:#5b6673;--offb:#eef1f4;--x:#6d28d9;--xb:#f3edff;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:16px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft);font-variant-numeric:tabular-nums}
a{color:inherit}button{font:inherit;color:inherit}.cond,.badge,h1{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{background:var(--co);color:var(--coi);padding:10px 16px;position:sticky;top:0;z-index:1000;padding-top:max(10px,env(safe-area-inset-top))}.hb{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;min-height:36px}.hb img{height:30px;background:#fff;border-radius:6px;padding:2px 5px}.hb .t{line-height:1.1;min-width:0}.hb .t b{display:block;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .t small{opacity:.85;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 16px 32px}
.hero{display:grid;gap:12px;margin-bottom:6px}
.gps{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;border-radius:var(--r);background:var(--co);color:var(--coi);text-decoration:none;box-shadow:0 6px 18px #0b1f3326}.gps .gi{width:40px;height:40px;border-radius:50%;background:#ffffff26;display:grid;place-items:center}.gps .gi svg{width:22px;height:22px}.gps b{display:block;font-size:18px;line-height:1.15}.gps small{display:block;opacity:.9;font-size:13.5px}
.sb{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--rule);border-radius:var(--r);padding:0 12px;min-height:52px}.sb:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px #ffcc0099}.sb svg{color:var(--mut)}.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;padding:12px 0;color:var(--ink)}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.fchips a{flex:none;text-decoration:none;border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;min-height:40px;display:inline-flex;align-items:center}.fchips a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px}
.card{display:block;background:#fff;border:1px solid var(--rule);border-radius:var(--r);text-decoration:none;margin-bottom:8px}
.lc{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;min-height:64px}.lc .lt{flex:1;min-width:0}.lc .lt b{display:block;font-size:16px;line-height:1.2;font-weight:600}.lc .lt small{display:block;color:var(--mut);font-size:14px;margin-top:2px}.lc>svg{color:#9aa6b2}
.cx{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;line-height:1.3}.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}.chip.on{background:var(--okb);color:var(--ok)}.chip.off{background:var(--offb);color:var(--off)}.chip.off i{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}.chip.x{background:var(--xb);color:var(--x)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:64px;background:var(--fc);color:var(--fi);font-weight:700;font-size:20px;border-radius:9px;padding:3px 9px;white-space:nowrap;flex:none}.badge.big{font-size:32px;min-width:92px;border-radius:12px;padding:4px 14px}.badge.sm{font-size:15px;min-width:0;padding:1px 7px;border-radius:6px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;color:var(--mut);margin:0 0 12px;min-height:44px}
.lh{display:flex;gap:14px;align-items:center}.lh h1{margin:0;font-size:24px;line-height:1.12}.lh p{margin:3px 0 0;color:var(--mut)}
.trips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}.trips span{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:14px}.trips b{font-family:"Barlow Condensed",Arial,sans-serif;font-size:19px}
.seg{display:flex;gap:6px;margin:14px 0 10px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:4px}.seg button{flex:1;font-weight:700;border:0;background:transparent;border-radius:9px;min-height:44px;cursor:pointer}.seg button.on{background:var(--fc);color:var(--fi)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;font-weight:700;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:12px;min-height:46px;padding:8px 12px;cursor:pointer}.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.map{height:280px;border-radius:var(--r);overflow:hidden;border:1px solid var(--rule);margin:4px 0 12px;background:#e9edf2}.map[hidden]{display:none}.map .msg{padding:14px;color:var(--mut)}
.tbl{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:8px 6px;overflow-x:auto}
table.strip{border-collapse:collapse;width:100%}.strip th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:0 6px 4px}.strip th:last-child{text-align:left}.strip td{padding:0 6px;height:48px;vertical-align:middle}.strip td.tm{text-align:right;font-family:"Barlow Condensed",Arial,sans-serif;font-size:21px;font-weight:600;white-space:nowrap;width:1%}.strip td.tm.xt{color:var(--x);background:var(--xb)}.strip th.xh{background:#7c3aed;color:#fff;border-radius:3px}.xn{background:#7c3aed;color:#fff;border-radius:3px;padding:0 3px;font-style:normal;font-size:.85em}.xs{color:var(--x)}
.strip td.dot{position:relative;width:28px;padding:0}.strip th.no{text-align:center;padding:0 0 4px}.strip td.dot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--fc)}.strip tr:first-child td.dot::before{top:50%}.strip tr:last-child td.dot::before{bottom:50%}.strip td.dot i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;border:3px solid var(--fc);display:grid;place-items:center;font:normal 700 14px/1 "Barlow Condensed",Arial,sans-serif;color:var(--ink)}.strip tr.t td.dot i{width:17px;height:17px;margin:-8.5px;border-radius:4px;background:var(--fc)}
.strip td.nm a{text-decoration:none;display:block}.strip td.nm b{font-weight:600;display:block;line-height:1.15}.strip td.nm small{color:var(--mut);font-size:13px}.pc{font-family:"Barlow Condensed",Arial,sans-serif;background:var(--soft);border-radius:4px;padding:0 4px;font-weight:600;color:var(--ink)}
.sh .code{display:inline-block;background:var(--ink);color:#fff;border-radius:7px;padding:1px 9px;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:19px}.sh h1{font-size:30px;margin:8px 0 2px;line-height:1.05}.sh p{margin:0;color:var(--mut)}
.sl{display:flex;gap:12px;align-items:center;padding:12px 14px}.sl .sx{flex:1;min-width:0}.sl b{display:block;line-height:1.2}.sl small{display:block;color:var(--mut);font-size:13.5px}.sl .tm{text-align:right;font-family:"Barlow Condensed",Arial,sans-serif;font-size:19px;font-weight:600;white-space:nowrap}.sl .tm small{font-family:Barlow,Arial,sans-serif;font-size:12px;font-weight:600}
.nx{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ok)}.nx.off{color:var(--off)}
.nc{display:flex;gap:14px;align-items:flex-start;padding:14px}.nd{flex:none;min-width:76px;text-align:center;background:var(--soft);border-radius:12px;padding:8px 6px}.nd b{display:block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:22px;line-height:1}.nd small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}.nt{flex:1;min-width:0}.nt b{display:block;line-height:1.2}.nt small{display:block;color:var(--mut);font-size:13.5px}.nl{display:grid;gap:5px;margin-top:8px}.nl span{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.st{color:var(--mut);margin:0 0 10px}.est{font-size:13px;color:var(--mut)}.note{font-size:13px;color:var(--mut);margin:22px 0 0;border-top:1px solid var(--rule);padding-top:12px}.empty{color:var(--mut);padding:18px 4px}.bairro{display:inline-flex;align-items:center;min-height:40px;margin:0 6px 6px 0;padding:6px 12px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;font-weight:600;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #ffcc00;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}h1:focus{outline:0}
.pin{width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid var(--fc);display:grid;place-items:center;font:700 11px/1 "Barlow Condensed",Arial,sans-serif;color:var(--ink);box-shadow:0 1px 3px #0006}.pin.t{width:16px;height:16px;border-radius:4px;background:var(--fc);margin:2px}.pin.x{border-color:#7c3aed;color:#6d28d9;width:auto;padding:0 3px;border-radius:5px;font-size:9px;white-space:nowrap}
.me{width:16px;height:16px;border-radius:50%;background:#e11d48;border:3px solid #fff;box-shadow:0 0 0 6px #e11d4833}
@media(min-width:720px){main{padding-top:22px}.hero{grid-template-columns:1fr 1.4fr;align-items:center}.hero .fchips{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.hd{position:static}.gps,.sb,.acts,.map,.back{display:none!important}body{background:#fff}}

 function near(){killMap();V.innerHTML='<a class="back" href="#">'+ic('back')+'Todas as linhas</a><h1 style="margin:0 0 6px">Pontos perto de mim</h1><p class="st" id="st" role="status">Procurando a sua localização…</p><div id="nl"></div><div class="acts" id="na" hidden>'+mapUI('m')+'<button class="btn" id="more">Mostrar mais pontos</button></div><div class="map" id="m" hidden></div>'+foot();
  var N=3,list=[];
  function paint(){var C=canon();list=C.list.map(function(c,i){var s=C.of[i];return s&&s.la!=null?{c:c,s:s,d:dm(me,[s.la,s.lo])}:null;}).filter(Boolean).sort(function(a,b){return a.d-b.d;});
   document.getElementById('st').textContent='Os '+Math.min(N,list.length)+' pontos mais perto (≈ a pé, pelas ruas).';
   document.getElementById('nl').innerHTML=list.slice(0,N).map(function(x){var u=usesOf(x.c),seen=[];var ls=u.filter(function(y){var k=y.L.s+'|'+y.b.d;if(seen.indexOf(k)>=0)return false;seen.push(k);return true;}).map(function(y){return '<span>'+badge(y.L,'sm')+' '+y.b.d+' '+nextTxt(y)+'</span>';}).join('');
    return '<a class="card nc" href="#p='+encodeURIComponent(x.c)+'"><span class="nd"><b>≈ '+walkMin(x.d)+' min</b><small>a pé · '+distTxt(x.d)+'</small></span><span class="nt"><b>'+esc(x.s.n)+'</b><small>'+esc([x.s.r,x.s.b,x.c].filter(Boolean).join(' · '))+'</small><span class="nl">'+ls+'</span></span></a>';}).join('');
   document.getElementById('na').hidden=false;document.getElementById('more').hidden=N>=Math.min(10,list.length);say(document.getElementById('st').textContent);}
  var show=function(pos){me=[pos.coords.latitude,pos.coords.longitude];paint();
   document.getElementById('more').onclick=function(){N=10;paint();};
   mapBtn('m',function(m,bb){bb.extend(me);L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(m);list.slice(0,N).forEach(function(x){bb.extend([x.s.la,x.s.lo]);L.circleMarker([x.s.la,x.s.lo],{radius:8,color:'#fff',weight:2,fillColor:'#15202b',fillOpacity:1}).bindTooltip(esc(x.c+' · '+x.s.n)).on('click',function(){location.hash='p='+encodeURIComponent(x.c);}).addTo(m);});});};
  var fail=function(){document.getElementById('st').innerHTML='Não foi possível usar a localização. Permita o acesso à localização no celular ou <a href="#">busque pelo nome da rua ou do bairro</a>.';};
  if(!navigator.geolocation){fail();return;}navigator.geolocation.getCurrentPosition(show,fail,{enableHighAccuracy:true,timeout:12000,maximumAge:60000});}
 var TITLE=document.title,FIRST=true;
 function route(){var h=decodeURIComponent(location.hash.replace(/^#/,'')),m;if((m=/^l=(.+)$/.exec(h)))line(m[1],0);else if((m=/^p=(.+)$/.exec(h)))stop(m[1]);else if(h==='perto')near();else{m=/^f=(.+)$/.exec(h);home(m?m[1]:'');}
  /* leitor de tela: a tela mudou (título da aba + foco no título da tela) */
  var t=V.querySelector('h1');document.title=t?t.textContent+' · '+TITLE:TITLE;if(t&&!FIRST){t.tabIndex=-1;t.focus();}FIRST=false;}
 /* links internos (#l=…, #p=…) sem depender do endereço base — funciona hospedado, aberto do arquivo e na pré-visualização */
 document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var h=a.getAttribute('href');if(location.hash===h||(h==='#'&&!location.hash))route();else location.hash=h;});
 document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="http"],a[href^="mailto"]');if(a){a.target='_blank';a.rel='noopener';}},true);
 if(!location.hash&&window.PAGE_QS){var q=String(window.PAGE_QS).replace(/^\?/,'').split('&').filter(function(x){return /^(l|p|f)=/.test(x);})[0];if(q)history.replaceState(null,'','#'+q);}
 window.addEventListener('hashchange',route);route();})();</script></body></html>
